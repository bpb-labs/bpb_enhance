name: Build Artifacts

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: bpb_enhance

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --locked --release --features gui

      - name: Collect artifacts
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $ver = "${{ github.ref_name }}"
          Copy-Item "target\\release\\${env:BIN_NAME}.exe" "$out\\bpb-enhance-$ver.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpb_enhance-windows
          path: dist
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --locked --release --no-default-features --features cli

      - name: Collect artifacts
        run: |
          mkdir -p dist
          ver="${{ github.ref_name }}"
          cp "target/release/${BIN_NAME}" "dist/bpb-enhance-${ver}-linux-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpb_enhance-linux
          path: dist
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare release asset name
        id: release_asset
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import datetime as dt
          import os
          import pathlib
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d{4})\.(\d{1,2})\.(\d{1,2})", tag)
          if not match:
              print(f"::error::Release tag must match vYYYY.M.D; got {tag!r}")
              raise SystemExit(1)

          year, month, day = map(int, match.groups())
          try:
              release_date = dt.date(year, month, day)
          except ValueError as exc:
              print(f"::error::Release tag contains an invalid date: {tag!r} ({exc})")
              raise SystemExit(1)

          with pathlib.Path("assets/replace.toml").open("rb") as config_file:
              config = tomllib.load(config_file)

          game_version = config["version"]["required-game-version"]
          asset_name = f"bpb-enhance-gv{game_version}-{release_date:%y%m%d}.exe"

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"asset_name={asset_name}\n")

          print(f"Release asset name: {asset_name}")
          PY

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: bpb_enhance-windows
          path: dist/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: bpb_enhance-linux
          path: dist/linux

      - name: Rename Windows binary
        shell: bash
        env:
          ASSET_NAME: ${{ steps.release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          mkdir -p dist/release
          mapfile -t exe_files < <(find dist/windows -maxdepth 1 -type f -name '*.exe' -print)

          if [ "${#exe_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Windows .exe in dist/windows, found ${#exe_files[@]}"
            printf '%s\n' "${exe_files[@]}"
            exit 1
          fi

          mv "${exe_files[0]}" "dist/release/${ASSET_NAME}"

      - name: Rename Linux binary
        run: mv dist/linux/* dist/

      - name: Restore Linux executable permissions
        run: chmod +x dist/*-linux-x86_64

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*.exe
          tag_name: ${{ github.ref_name }}
